<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字分身卡片预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f7f8fa;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .phone {
        width: 393px;
        max-width: 100%;
      }

      .card {
        position: relative;
        overflow: hidden;
        min-height: 108px;
        border-radius: 28px;
        padding: 20px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        background-image: linear-gradient(135deg, #5f68ff 0%, #7b4dff 48%, #8f2fff 100%);
        box-shadow: 0 10px 24px rgba(99, 102, 241, 0.22);
      }

      .bg-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .glow-1 {
        position: absolute;
        right: 32px;
        top: 50%;
        transform: translateY(-50%);
        width: 96px;
        height: 96px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        filter: blur(1px);
      }

      .glow-2 {
        position: absolute;
        left: 64px;
        top: -32px;
        width: 160px;
        height: 96px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        filter: blur(18px);
      }

      .content {
        position: relative;
        z-index: 2;
        padding-right: 12px;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .sparkle {
        color: #fde047;
        font-size: 18px;
        line-height: 1;
      }

      .title {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        color: #ffffff;
        font-weight: 700;
      }

      .desc {
        margin: 6px 0 0;
        font-size: 12px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.9);
      }

      .avatar-wrap {
        position: relative;
        z-index: 2;
        width: 80px;
        height: 80px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .avatar-icon {
        width: 34px;
        height: 34px;
        stroke: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="phone">
        <div class="card">
          <div class="bg-layer">
            <div class="glow-1"></div>
            <div class="glow-2"></div>
          </div>

          <div class="content">
            <div class="title-row">
              <span class="sparkle">✦</span>
              <h3 class="title">我的数字分身与个人名片</h3>
            </div>
            <p class="desc">塑造专属 AI 分身形象，沉淀身份标签，开启更高效智能社交</p>
          </div>

          <div class="avatar-wrap" aria-hidden="true">
            <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c1.5-3.5 4.6-5 8-5s6.5 1.5 8 5"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </body>
  </html>
