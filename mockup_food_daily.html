<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1:1 还原 - 每日</title>
  <link rel="stylesheet" href="./dist/assets/index-BgtAlSu2.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { background: #e2e8f0; }
    .phone-scroll { scrollbar-width: none; }
    .phone-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-200 flex items-center justify-center p-4 sm:p-8 font-sans overflow-x-hidden">
  <div class="relative flex items-center gap-8 transition-all duration-700 ease-in-out">
    <div class="relative w-[375px] h-[812px] bg-slate-50 rounded-[3rem] shadow-2xl border-8 border-slate-900 overflow-hidden shrink-0 z-20">
      <div class="absolute top-2 left-1/2 -translate-x-1/2 w-[160px] h-8 rounded-[20px] bg-black z-[100] text-white flex items-center px-3 gap-2">
        <div class="w-5 h-5 rounded-full bg-orange-500/20 flex items-center justify-center">
          <i data-lucide="utensils" class="w-3 h-3 text-orange-500"></i>
        </div>
        <div class="flex-1 text-[10px] font-bold text-center truncate">美食打卡</div>
        <div class="w-1.5 h-1.5 rounded-full bg-red-500"></div>
      </div>

      <div class="absolute top-3.5 left-8 text-slate-900 text-xs font-bold z-[110] pointer-events-none">9:41</div>
      <div class="absolute top-3.5 right-8 flex gap-1 z-[110] pointer-events-none">
        <div class="w-4 h-3 bg-slate-900 rounded-sm"></div>
        <div class="w-3 h-3 bg-slate-900 rounded-full"></div>
      </div>

      <div class="w-full h-full overflow-hidden relative bg-slate-50">
        <div class="h-full w-full bg-slate-50 flex flex-col relative overflow-hidden">
          <header class="pt-12 pb-4 px-4 flex items-center justify-between bg-white border-b border-slate-100 z-[60] relative">
            <button class="w-10 h-10 flex items-center justify-center rounded-full">
              <i data-lucide="arrow-left" class="w-5 h-5 text-slate-800"></i>
            </button>
            <div class="flex gap-2 bg-slate-100 p-1 rounded-full">
              <button class="px-4 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1 text-slate-500">
                <i data-lucide="map" class="w-3.5 h-3.5"></i> 总览
              </button>
              <button class="px-4 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1 bg-white shadow-sm text-slate-900">
                <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> 每日
              </button>
            </div>
            <button class="w-10 h-10 flex items-center justify-center rounded-full">
              <i data-lucide="more-horizontal" class="w-5 h-5 text-slate-800"></i>
            </button>
          </header>

          <div class="flex-1 overflow-y-auto pb-20 relative phone-scroll">
            <div class="w-full h-48 bg-slate-200 relative mb-4 group cursor-pointer overflow-hidden">
              <img src="./dist/assets/guizhou_landscape-BLq5F9ep.jpg" class="w-full h-full object-cover opacity-80" alt="Trip Map" />
              <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full shadow-lg flex items-center gap-2 text-sm font-bold text-slate-800">
                  <i data-lucide="map" class="w-4 h-4 text-blue-600"></i>
                  查看路线地图
                </div>
              </div>
            </div>

            <div class="bg-white border-b border-slate-100 sticky top-0 z-40">
              <div class="flex overflow-x-auto phone-scroll px-4 py-3 gap-3">
                <button class="flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-slate-900 text-white border-slate-900 shadow-md transform scale-105">Day 1</button>
                <button class="flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-white text-slate-500 border-slate-200">Day 2</button>
                <button class="flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all border bg-white text-slate-500 border-slate-200">Day 3</button>
              </div>
            </div>

            <div class="px-6 py-6 bg-white mb-2">
              <div class="space-y-3">
                <div class="relative mb-6">
                  <div class="flex items-center justify-between mb-3 px-1 relative z-20">
                    <div class="flex items-center gap-3">
                      <span class="text-xl font-bold text-slate-400 font-mono tracking-wider">08:00</span>
                      <div class="px-2 py-0.5 rounded text-[10px] font-bold flex items-center gap-1 bg-slate-100 text-slate-500">
                        <i data-lucide="map-pin" class="w-2.5 h-2.5"></i>
                        航班
                      </div>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full text-slate-400 bg-slate-100">已完成</span>
                  </div>

                  <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 relative overflow-hidden">
                    <div class="flex justify-between items-start mb-4">
                      <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                          <i data-lucide="plane" class="w-4 h-4"></i>
                        </div>
                        <div>
                          <div class="text-lg font-bold text-slate-800">CZ3685</div>
                          <div class="text-[10px] text-slate-400">预计提前10分钟抵达</div>
                        </div>
                      </div>
                      <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-50 text-blue-800">智能体</span>
                    </div>

                    <div class="flex justify-between items-center mb-4 px-2">
                      <div class="text-center">
                        <div class="text-sm font-bold text-slate-800 mb-1">北京大兴</div>
                        <div class="text-lg font-black text-blue-600 font-mono">06:00</div>
                        <div class="text-[10px] text-slate-400 mt-1">准点率95%</div>
                      </div>
                      <div class="flex-1 flex flex-col items-center px-4">
                        <div class="text-[10px] text-slate-400 mb-1">2h 10m</div>
                        <div class="w-full h-px bg-slate-200 relative">
                          <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-4 bg-white flex items-center justify-center">
                            <i data-lucide="plane" class="w-3 h-3 text-slate-300 rotate-90"></i>
                          </div>
                        </div>
                        <div class="text-[10px] text-slate-400 mt-1">经济舱</div>
                      </div>
                      <div class="text-center">
                        <div class="text-sm font-bold text-slate-800 mb-1">龙洞堡T2</div>
                        <div class="text-lg font-black text-blue-600 font-mono">08:10</div>
                        <div class="text-[10px] text-slate-400 mt-1">飞行中</div>
                      </div>
                    </div>

                    <div class="bg-orange-50/50 rounded-lg p-2.5 mb-4 flex gap-2 items-start border border-orange-100/50">
                      <div class="mt-0.5"><i data-lucide="sparkles" class="w-2.5 h-2.5 text-orange-500"></i></div>
                      <div class="text-[10px] text-slate-600 leading-relaxed">
                        <span class="font-bold text-orange-600">黄小西Tips：</span>建议提前2小时到达机场。
                      </div>
                    </div>

                    <div class="flex gap-2">
                      <button class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-blue-200 shadow-sm flex items-center justify-center gap-1">
                        <i data-lucide="navigation" class="w-3.5 h-3.5"></i> 一键导航
                      </button>
                      <button class="flex-1 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> 值机选座
                      </button>
                      <button class="flex-1 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                        <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 改签退票
                      </button>
                    </div>
                  </div>
                </div>

                <div class="relative mb-6">
                  <div class="flex items-center justify-between mb-3 px-1 relative z-20">
                    <div class="flex items-center gap-3">
                      <span class="text-xl font-bold text-slate-400 font-mono tracking-wider">09:30</span>
                      <div class="px-2 py-0.5 rounded text-[10px] font-bold flex items-center gap-1 bg-slate-100 text-slate-500">
                        <i data-lucide="map-pin" class="w-2.5 h-2.5"></i>
                        美食
                      </div>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full text-blue-600 bg-blue-50">进行中</span>
                  </div>

                  <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                    <div class="text-lg font-bold text-slate-800">六广门毛阿姨糯米饭</div>
                    <div class="mt-2 text-xs text-slate-500">4.8 | ¥12/人</div>
                    <div class="mt-1 text-xs text-slate-500">距离下个节点</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="absolute bottom-1 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-slate-900/20 rounded-full z-50"></div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
