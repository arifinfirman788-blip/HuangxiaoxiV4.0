<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的服务区域预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #1f2937;
      }

      .stage {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px 16px;
      }

      .phone {
        width: 393px;
        max-width: 100%;
      }

      .panel {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .title {
        margin: 0 0 16px;
        padding: 0 4px;
        font-size: 17px;
        font-weight: 700;
        color: #1f2937;
      }

      .divider {
        height: 1px;
        background: #f3f4f6;
        margin: 20px 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px 16px;
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .icon-wrap {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .label {
        font-size: 12px;
        color: #374151;
      }

      .pink { background: #fdf2f8; color: #ec4899; }
      .orange { background: #fff7ed; color: #f97316; }
      .yellow { background: #fffbeb; color: #eab308; }
      .blue { background: #eff6ff; color: #3b82f6; }
      .indigo { background: #eef2ff; color: #6366f1; }
      .green { background: #f0fdf4; color: #22c55e; }
      .purple { background: #f5f3ff; color: #8b5cf6; }

      svg { width: 24px; height: 24px; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <div class="panel">
          <h2 class="title">我的服务</h2>
          <div class="grid">
            <div class="item">
              <div class="icon-wrap pink">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L4.22 13.45 12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </div>
              <span class="label">我的收藏</span>
            </div>
            <div class="item">
              <div class="icon-wrap orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="9" cy="21" r="1"></circle>
                  <circle cx="20" cy="21" r="1"></circle>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
              </div>
              <span class="label">购物车</span>
            </div>
            <div class="item">
              <div class="icon-wrap yellow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="8" width="18" height="13" rx="2"></rect>
                  <path d="M12 8v13M3 12h18M7 8a2 2 0 1 1 0-4c2 0 5 4 5 4M17 8a2 2 0 1 0 0-4c-2 0-5 4-5 4"></path>
                </svg>
              </div>
              <span class="label">优惠券</span>
            </div>
            <div class="item">
              <div class="icon-wrap blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <path d="M16 2v4M8 2v4M3 10h18"></path>
                  <path d="m9 16 2 2 4-4"></path>
                </svg>
              </div>
              <span class="label">我的行程</span>
            </div>
            <div class="item">
              <div class="icon-wrap indigo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                  <path d="M2 10h20"></path>
                </svg>
              </div>
              <span class="label">名片夹</span>
            </div>
          </div>

          <div class="divider"></div>

          <h3 class="title">订单中心</h3>
          <div class="grid">
            <div class="item">
              <div class="icon-wrap green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 6l9-3 9 3-9 3-9-3z"></path>
                  <path d="M3 6v12l9 3 9-3V6"></path>
                </svg>
              </div>
              <span class="label">线路</span>
            </div>
            <div class="item">
              <div class="icon-wrap blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 21h18"></path>
                  <path d="M5 21V7l7-4 7 4v14"></path>
                  <path d="M9 21v-6h6v6"></path>
                </svg>
              </div>
              <span class="label">景区</span>
            </div>
            <div class="item">
              <div class="icon-wrap orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 7h18v14H3z"></path>
                  <path d="M8 7V5a4 4 0 0 1 8 0v2"></path>
                </svg>
              </div>
              <span class="label">酒店</span>
            </div>
            <div class="item">
              <div class="icon-wrap purple">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="8" cy="8" r="4"></circle>
                  <circle cx="16" cy="16" r="4"></circle>
                  <path d="M12 12l8 8"></path>
                </svg>
              </div>
              <span class="label">活动</span>
            </div>
            <div class="item">
              <div class="icon-wrap blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2l7 19-7-4-7 4 7-19z"></path>
                </svg>
              </div>
              <span class="label">出行</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  </html>
