<!doctype html>

<body class="min-h-screen bg-slate-200 flex items-center justify-center p-4 sm:p-8 font-sans overflow-x-hidden">

                  查看路线地图

                              <i data-lucide="plane" class="w-4 h-4"></i>
                            </div>
                            <div>

                          </button>
                          <button class="flex-1 py-2 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
