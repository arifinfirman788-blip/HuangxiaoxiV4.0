<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect x="20" y="20" width="360" height="360" rx="40" fill="#C4C2F6" />
  
  <!-- Subtle map lines in background -->
  <path d="M 20 100 Q 100 150 200 100 T 380 150" fill="none" stroke="#A9A5E8" stroke-width="2" />
  <path d="M 20 250 Q 150 200 250 300 T 380 250" fill="none" stroke="#A9A5E8" stroke-width="2" />
  <path d="M 150 20 Q 200 100 150 200 T 200 380" fill="none" stroke="#A9A5E8" stroke-width="2" />
  
  <!-- Sparkles -->
  <path d="M 220 100 L 225 115 L 240 120 L 225 125 L 220 140 L 215 125 L 200 120 L 215 115 Z" fill="#FFFFFF" opacity="0.8" />
  <path d="M 120 180 L 123 188 L 131 191 L 123 194 L 120 202 L 117 194 L 109 191 L 117 188 Z" fill="#FFFFFF" opacity="0.8" />
  <path d="M 280 300 L 284 310 L 294 314 L 284 318 L 280 328 L 276 318 L 266 314 L 276 310 Z" fill="#FFFFFF" opacity="0.8" />

  <!-- Central Element: Camera -->
  <g transform="translate(100, 140)">
    <!-- Camera Body -->
    <rect x="0" y="20" width="200" height="120" rx="10" fill="#5B53A6" />
    <!-- Top Flash/Viewfinder area -->
    <rect x="60" y="0" width="80" height="20" rx="4" fill="#FFFFFF" />
    <circle cx="100" cy="10" r="6" fill="#5B53A6" />
    <!-- Flash -->
    <rect x="20" y="30" width="30" height="15" rx="4" fill="#7A73C4" />
    <circle cx="35" cy="37.5" r="4" fill="#FFFFFF" />
    <!-- Lens Outer -->
    <circle cx="100" cy="80" r="50" fill="#C4C2F6" />
    <!-- Lens Middle -->
    <circle cx="100" cy="80" r="40" fill="#7A73C4" />
    <!-- Lens Inner -->
    <circle cx="100" cy="80" r="25" fill="#3D367A" />
    <!-- Lens Highlight -->
    <circle cx="90" cy="70" r="8" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Polaroid Photos -->
  <!-- Photo 1 (Top Left) -->
  <g transform="translate(50, 80) rotate(-20)">
    <rect x="0" y="0" width="120" height="90" fill="#FFFFFF" rx="4" />
    <rect x="5" y="5" width="110" height="65" fill="#A9A5E8" />
    <circle cx="30" cy="25" r="10" fill="#FFFFFF" opacity="0.5" />
    <path d="M 5 70 L 45 35 L 85 70 Z" fill="#7A73C4" />
    <path d="M 55 70 L 85 45 L 115 70 Z" fill="#5B53A6" />
  </g>

  <!-- Photo 2 (Bottom Left) -->
  <g transform="translate(60, 220) rotate(15)">
    <rect x="0" y="0" width="120" height="90" fill="#FFFFFF" rx="4" />
    <rect x="5" y="5" width="110" height="65" fill="#A9A5E8" />
    <circle cx="80" cy="25" r="10" fill="#FFFFFF" opacity="0.5" />
    <path d="M 5 70 L 45 30 L 85 70 Z" fill="#5B53A6" />
    <path d="M 55 70 L 85 40 L 115 70 Z" fill="#3D367A" />
  </g>

  <!-- Photo 3 (Bottom Right) -->
  <g transform="translate(220, 200) rotate(-10)">
    <rect x="0" y="0" width="120" height="90" fill="#FFFFFF" rx="4" />
    <rect x="5" y="5" width="110" height="65" fill="#A9A5E8" />
    <circle cx="30" cy="30" r="15" fill="#FFFFFF" opacity="0.5" />
    <path d="M 5 70 L 60 40 L 115 70 Z" fill="#7A73C4" />
  </g>
</svg>
